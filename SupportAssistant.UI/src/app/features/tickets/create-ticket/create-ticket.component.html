
<div class="ticket-container">

  <h2>Create Support Ticket</h2>
  <p>Describe the technical issue you are facing.</p>

  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">

    <label>Issue Title</label>
    <input
      type="text"
      formControlName="title"
      placeholder="Example: Application login failure">

    <small *ngIf="ticketForm.controls.title.touched && ticketForm.controls.title.invalid">
      Title must contain at least 5 characters.
    </small>

    <label>Description</label>
    <textarea
      formControlName="description"
      rows="5"
      placeholder="Explain the issue in detail...">
    </textarea>

    <small *ngIf="ticketForm.controls.description.touched && ticketForm.controls.description.invalid">
      Description must contain at least 10 characters.
    </small>

    <label>Environment</label>
    <select formControlName="environment">
      <option value="Development">Development</option>
      <option value="Testing">Testing</option>
      <option value="Production">Production</option>
    </select>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating...' : 'Create Ticket' }}
    </button>

  </form>

</div>
